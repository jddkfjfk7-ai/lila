# Kero Chess production profile.
# This file intentionally fails closed when required production secrets are missing.
# Load with: -Dconfig.file=conf/kero-production.conf

include "application"

net.domain = ${KERO_DOMAIN}
net.prodDomain = ${KERO_DOMAIN}
net.site.name = ${KERO_SITE_NAME}
net.asset.domain = ${KERO_ASSET_DOMAIN}
net.asset.base_url = ${KERO_ASSET_BASE_URL}
net.base_url = ${KERO_BASE_URL}
net.crawlable = true
net.ratelimit = true

play.http.secret.key = ${KERO_PLAY_SECRET}
play.http.session.cookieName = "kero_session"
play.ws.compressionEnabled = false

fishnet.offline_mode = false

security.email_confirm.enabled = true
security.password_reset.secret = ${KERO_PASSWORD_RESET_SECRET}
security.email_confirm.secret = ${KERO_EMAIL_CONFIRM_SECRET}
security.email_change.secret = ${KERO_EMAIL_CHANGE_SECRET}
security.login_token.secret = ${KERO_LOGIN_TOKEN_SECRET}
security.turnstile_cookie.secret = ${KERO_TURNSTILE_COOKIE_SECRET}
security.ip2proxy.enabled = false
security.ip2proxy.url = ${?KERO_IP2PROXY_URL}

mailer.primary.mock = false
mailer.primary.host = ${KERO_SMTP_HOST}
mailer.primary.port = 587
mailer.primary.tls = true
mailer.primary.user = ${KERO_SMTP_USER}
mailer.primary.password = ${KERO_SMTP_PASSWORD}
mailer.primary.sender = ${KERO_SMTP_SENDER}

kaladin.enabled = false

kamon.enabled = true
kamon.environment.service = "kero-chess"

# Keep database and Redis endpoints private; supply production URIs through environment variables.
mongodb.uri = ${KERO_MONGODB_URI}
redis.uri = ${KERO_REDIS_URI}
socket.redis.uri = ${KERO_REDIS_URI}

# Production password hashing secret; never reuse the development value.
user.password.bpass.secret = ${KERO_PASSWORD_HASH_SECRET}
