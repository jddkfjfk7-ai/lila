# Kero Chess production profile.
# No production credentials are stored here.

net.ratelimit = true
net.crawlable = true
fishnet.offline_mode = false

security.ip2proxy.enabled = false
security.ip2proxy.url = ""
security.ip2proxy.url = ${?KERO_IP2PROXY_URL}

# Enable only after the Kaladin service is deployed and connected.
kaladin.enabled = false

kamon.enabled = true
play.ws.compressionEnabled = true
